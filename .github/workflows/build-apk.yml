name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode and extract pre-generated body-part PNGs
        run: |
          mkdir -p app/src/main/res/drawable
          cat tools/piece_00_00 tools/piece_00_01 tools/piece_00_02 tools/piece_00_03 \
              tools/piece_01_00 tools/piece_01_01 tools/piece_01_02 tools/piece_01_03 \
              tools/piece_02_00 tools/piece_02_01 tools/piece_02_02 tools/piece_02_03 \
              tools/piece_03_00 tools/piece_03_01 tools/piece_03_02 tools/piece_03_03 \
              tools/chunk_04 | base64 -d | tar xz -C app/src/main/res/drawable
          echo "Extracted $(ls app/src/main/res/drawable | wc -l) PNGs"

      - name: Accept Android licenses & install packages
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          export ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: axie-offline-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
